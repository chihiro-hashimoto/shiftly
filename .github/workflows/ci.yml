name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run build:gas
      - run: npm run build:preview
      - run: npm run test:integration
      - run: npm run test:security
      - name: 文書が最新か（コードから生成した文書との差分）
        run: npm run docs && git diff --exit-code -- docs/database-schema.md docs/permission-matrix.md
      - name: Playwright ブラウザ
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # プレビュー（モックデータ）と GAS 配布物を成果物として保存（非公開リポジトリの Artifacts。外部公開はしない）
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shiftly-preview
          path: dist/preview
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: shiftly-gas-bundle
          path: dist/gas
          retention-days: 14
